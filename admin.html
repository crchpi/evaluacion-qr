<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administración de evaluaciones</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
  <h1 class="text-2xl font-semibold text-slate-900">Administración de evaluaciones</h1>

  <!-- Acceso -->
  <section id="acceso" class="rounded-2xl bg-white border border-slate-200 p-5 shadow-sm">
    <label for="clave" class="block text-sm font-medium text-slate-700">Clave de administrador</label>
    <div class="mt-2 flex gap-2">
      <input id="clave" type="password" autocomplete="current-password"
        class="flex-1 rounded-lg border border-slate-300 px-3 py-2.5 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
      <button id="btnIngresar" class="rounded-lg bg-indigo-700 px-4 py-2.5 font-semibold text-white hover:bg-indigo-800">Ingresar</button>
    </div>
    <p id="errAcceso" class="mt-2 hidden text-sm text-rose-600"></p>
  </section>

  <div id="panel" class="hidden space-y-6">
    <section class="rounded-2xl bg-white border border-slate-200 p-5 shadow-sm">
      <label for="selPrueba" class="block text-sm font-medium text-slate-700">Prueba</label>
      <select id="selPrueba" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5"></select>
    </section>

    <!-- QR -->
    <section class="rounded-2xl bg-white border border-slate-200 p-5 shadow-sm">
      <h2 class="text-lg font-semibold text-slate-900">Código QR de la evaluación</h2>
      <label for="urlPublica" class="mt-3 block text-sm font-medium text-slate-700">Enlace que abrirán los estudiantes</label>
      <input id="urlPublica" type="url" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
      <p class="mt-1 text-xs text-slate-500">Se completa solo con la dirección donde publicaste esta web. Corrígelo si es necesario.</p>
      <div class="mt-4 flex flex-col items-center gap-3">
        <div id="qr" class="rounded-lg bg-white p-3 border border-slate-200"></div>
        <button id="btnQR" class="rounded-lg bg-indigo-700 px-4 py-2.5 font-semibold text-white hover:bg-indigo-800">Descargar QR (PNG)</button>
      </div>
    </section>

    <!-- Resultados -->
    <section class="rounded-2xl bg-white border border-slate-200 p-5 shadow-sm">
      <h2 class="text-lg font-semibold text-slate-900">Resultados</h2>
      <div class="mt-3 flex flex-wrap gap-2">
        <button id="btnCargar" class="rounded-lg border border-slate-300 px-4 py-2.5 font-medium hover:bg-slate-50">Cargar resultados</button>
        <button id="btnExcel" class="rounded-lg bg-emerald-600 px-4 py-2.5 font-semibold text-white hover:bg-emerald-700 disabled:opacity-50" disabled>Descargar Excel</button>
      </div>
      <p id="resumen" class="mt-3 text-sm text-slate-600"></p>
      <div class="mt-3 overflow-x-auto"><table id="tabla" class="min-w-full text-sm"></table></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script>
(() => {
  'use strict';
  const URL_API = (window.EVAL_CONFIG.APPS_SCRIPT_URL || '').trim();
  const $ = (id) => document.getElementById(id);
  let clave = '', pruebas = [], filas = [];

  async function api(cuerpo) {
    if (!URL_API) throw new Error('Falta configurar APPS_SCRIPT_URL en config.js');
    const r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(cuerpo), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error');
    return d;
  }

  $('btnIngresar').addEventListener('click', async () => {
    $('errAcceso').classList.add('hidden');
    try {
      clave = $('clave').value;
      const d = await api({ accion: 'admin_pruebas', clave });
      pruebas = d.pruebas;
      $('selPrueba').replaceChildren(...pruebas.map((p) => {
        const o = document.createElement('option');
        o.value = p.id; o.textContent = `${p.titulo} (${p.id}) · ${p.respuestas} envíos`;
        return o;
      }));
      $('acceso').classList.add('hidden'); $('panel').classList.remove('hidden');
      actualizarQR();
    } catch (e) { $('errAcceso').textContent = e.message; $('errAcceso').classList.remove('hidden'); }
  });
  $('clave').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnIngresar').click(); });

  /* ----- QR ----- */
  function enlaceBase(id) {
    const base = new URL('index.html', location.href);
    base.search = ''; base.searchParams.set('prueba', id);
    return base.href;
  }
  function actualizarQR() {
    const id = $('selPrueba').value;
    if (!id) return;
    if (!$('urlPublica').dataset.editado) $('urlPublica').value = enlaceBase(id);
    dibujarQR();
    filas = []; $('tabla').replaceChildren(); $('resumen').textContent = ''; $('btnExcel').disabled = true;
  }
  function dibujarQR() {
    const cont = $('qr'); cont.replaceChildren();
    if (!$('urlPublica').value) return;
    new QRCode(cont, { text: $('urlPublica').value, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.M });
  }
  $('selPrueba').addEventListener('change', () => { delete $('urlPublica').dataset.editado; actualizarQR(); });
  $('urlPublica').addEventListener('input', () => { $('urlPublica').dataset.editado = '1'; dibujarQR(); });

  $('btnQR').addEventListener('click', () => {
    const src = $('qr').querySelector('canvas');
    if (!src) return;
    const p = pruebas.find((x) => x.id === $('selPrueba').value);
    const pad = 40, texto = p ? p.titulo : '';
    const c = document.createElement('canvas');
    c.width = src.width + pad * 2; c.height = src.height + pad * 2 + 40;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(src, pad, pad);
    g.fillStyle = '#0f172a'; g.font = 'bold 20px sans-serif'; g.textAlign = 'center';
    g.fillText(texto, c.width / 2, src.height + pad * 2 + 8, c.width - 20);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png'); a.download = `QR_${$('selPrueba').value}.png`; a.click();
  });

  /* ----- Resultados ----- */
  $('btnCargar').addEventListener('click', async () => {
    $('resumen').textContent = 'Cargando…';
    try {
      const d = await api({ accion: 'admin_resultados', clave, prueba: $('selPrueba').value });
      filas = d.filas || [];
      const datos = filas.slice(1);
      const t = $('tabla'); t.replaceChildren();
      if (!filas.length) { $('resumen').textContent = 'Aún no hay envíos.'; return; }
      const vista = filas.map((f) => f.slice(0, 8));
      vista.slice(0, 51).forEach((f, i) => {
        const tr = document.createElement('tr');
        tr.className = i === 0 ? 'bg-indigo-50 font-semibold' : 'border-t border-slate-100';
        f.forEach((v) => { const td = document.createElement('td'); td.className = 'px-2 py-1.5 whitespace-nowrap'; td.textContent = v; tr.appendChild(td); });
        t.appendChild(tr);
      });
      const pr = datos.length ? datos.reduce((s, f) => s + Number(f[6] || 0), 0) / datos.length : 0;
      $('resumen').textContent = `${datos.length} envíos · promedio de logro ${pr.toFixed(1)}%` + (datos.length > 50 ? ' · vista previa de los primeros 50 (el Excel trae todos)' : '');
      $('btnExcel').disabled = datos.length === 0;
    } catch (e) { $('resumen').textContent = e.message; }
  });

  $('btnExcel').addEventListener('click', () => {
    const datos = filas.map((f, i) => i === 0 ? f : f.map((v, j) => (j >= 4 && j <= 7 && v !== '' && !isNaN(v)) ? Number(v) : v));
    const ws = XLSX.utils.aoa_to_sheet(datos);
    ws['!cols'] = [{ wch: 19 }, { wch: 34 }, { wch: 13 }, { wch: 14 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Resultados');
    XLSX.writeFile(wb, `Resultados_${$('selPrueba').value}.xlsx`);
  });
})();
</script>
</body>
</html>
